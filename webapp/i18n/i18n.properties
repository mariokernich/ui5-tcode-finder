# Welcome dialog
welcomeTitle=Welcome to T-Code Quick Finder! 🎉
welcomeText=<p>Welcome to <strong>T-Code Quick Finder</strong>, your tool to quickly find, copy and manage SAP transaction codes (T-Codes).</p>\
	<p>Here are some key features:</p>\
	<ul>\
	<li><strong>Search:</strong> Use the search bar to find T-Codes by code, title or description.</li>\
	<li><strong>Copy:</strong> Click on a T-Code to copy it to your clipboard. In the settings you can choose to copy it with a /n or /o prefix or to open it in SAP GUI for HTML (WebGUI).</li>\
	<li><strong>Favorites:</strong> Mark T-Codes as favorites to keep them at the top of the list.</li>\
	<li><strong>Recent:</strong> The RECENT tab lists the T-Codes you copied or opened last.</li>\
	<li><strong>Custom T-Codes:</strong> Add, edit and delete your own T-Codes in the CUSTOM group. Right-click a custom T-Code to edit it.</li>\
	<li><strong>Settings:</strong> Choose the design, the click behavior and the visible groups, and export or import your data.</li>\
	</ul>\
	<p>Enjoy your development journey! 🌟</p>
welcomeDoNotShowAgain=Do not show again
