# Welcome dialog
welcomeTitle=Willkommen beim T-Code Quick Finder! 🎉
welcomeText=<p>Willkommen beim <strong>T-Code Quick Finder</strong>, Ihrem Werkzeug, um SAP-Transaktionscodes (T-Codes) schnell zu finden, zu kopieren und zu verwalten.</p>\
	<p>Die wichtigsten Funktionen:</p>\
	<ul>\
	<li><strong>Suche:</strong> Finden Sie T-Codes über Code, Titel oder Beschreibung.</li>\
	<li><strong>Kopieren:</strong> Klicken Sie auf einen T-Code, um ihn in die Zwischenablage zu kopieren. In den Einstellungen können Sie festlegen, dass er mit dem Präfix /n oder /o kopiert oder in SAP GUI for HTML (WebGUI) geöffnet wird.</li>\
	<li><strong>Favoriten:</strong> Markieren Sie T-Codes als Favoriten, damit sie oben in der Liste stehen.</li>\
	<li><strong>Zuletzt verwendet:</strong> Der Reiter ZULETZT VERWENDET zeigt die T-Codes, die Sie zuletzt kopiert oder geöffnet haben.</li>\
	<li><strong>Eigene T-Codes:</strong> Legen Sie in der Gruppe EIGENE eigene T-Codes an, bearbeiten und löschen Sie sie. Klicken Sie mit der rechten Maustaste auf einen eigenen T-Code, um ihn zu bearbeiten.</li>\
	<li><strong>Offline:</strong> Installieren Sie die App über Ihren Browser, um sie auch ohne Internetverbindung zu nutzen.</li>\
	<li><strong>Einstellungen:</strong> Wählen Sie Design, Klickverhalten und sichtbare Gruppen, und exportieren oder importieren Sie Ihre Daten.</li>\
	</ul>\
	<p>Viel Erfolg bei der Entwicklung! 🌟</p>
welcomeDoNotShowAgain=Nicht mehr anzeigen
